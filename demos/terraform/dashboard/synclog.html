<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Log — DAB Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">
  <style>
    :root {
      --bg:       #0f1117;
      --card:     #1a1d27;
      --border:   #2a2d3e;
      --accent:   #f97316;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #eab308;
      --blue:     #3b82f6;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --code-bg:  #0d1117;
    }
    [data-theme="light"] {
      --bg:      #f1f5f9;
      --card:    #ffffff;
      --border:  #e2e8f0;
      --text:    #1e293b;
      --muted:   #94a3b8;
      --code-bg: #f8fafc;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .brand small {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.1rem;
    }
    .header-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.4rem 0.85rem;
      transition: border-color 0.15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #ea6c0a; border-color: #ea6c0a; }

    /* ── Main ────────────────────────────────────────────── */
    main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

    /* ── URL bar (the demo money shot) ──────────────────── */
    /* Always dark — it's a terminal, not a card. Colours pop on any theme. */
    .url-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .url-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6e7681;
      white-space: nowrap;
      padding-top: 0.15rem;
      flex-shrink: 0;
    }
    .url-text {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.82rem;
      color: #e6edf3;
      word-break: break-all;
      line-height: 1.6;
    }
    .url-text .qs-key   { color: #79c0ff; }   /* GitHub blue  */
    .url-text .qs-val   { color: #7ee787; }   /* GitHub green */
    .url-text .qs-sep   { color: #6e7681; }   /* GitHub muted */
    .url-copy {
      background: none;
      border: 1px solid #30363d;
      border-radius: 0.4rem;
      color: #6e7681;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .url-copy:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Filters ─────────────────────────────────────────── */
    .filter-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .filter-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    select, input[type="date"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      color: var(--text);
      font-size: 0.875rem;
      padding: 0.4rem 0.65rem;
      min-width: 10rem;
      cursor: pointer;
    }
    select:focus, input[type="date"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .select-pill {
      display: flex;
      gap: 0.4rem;
    }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.3rem 0.8rem;
      font-size: 0.78rem;
      cursor: pointer;
      background: var(--bg);
      color: var(--text);
      transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .pill.active-green  { background: rgba(34,197,94,.2);  border-color: var(--green);  color: var(--green);  font-weight: 600; }
    .pill.active-red    { background: rgba(239,68,68,.2);  border-color: var(--red);    color: var(--red);    font-weight: 600; }

    /* $select toggle */
    .select-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .toggle-track {
      width: 2.2rem; height: 1.2rem;
      background: var(--border);
      border-radius: 999px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: var(--accent); }
    .toggle-knob {
      position: absolute;
      top: 0.15rem; left: 0.15rem;
      width: 0.9rem; height: 0.9rem;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-track.on .toggle-knob { transform: translateX(1rem); }

    /* ── Stats bar ───────────────────────────────────────── */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .stats-text { font-size: 0.82rem; color: var(--muted); }
    .stats-text strong { color: var(--text); }

    /* ── Table ───────────────────────────────────────────── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border); }
    th {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 0.75rem 1rem;
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    .col-id    { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .col-time  { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 0.82rem; }
    .col-dur   { font-variant-numeric: tabular-nums; font-size: 0.82rem; white-space: nowrap; }
    .col-error { font-size: 0.78rem; color: var(--red); max-width: 28rem; }
    .col-hidden { color: var(--muted); font-style: italic; font-size: 0.78rem; }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-success { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-error   { background: rgba(239,68,68,.15);  color: var(--red);   }
    .badge-source  { background: rgba(59,130,246,.12); color: var(--blue);  }
    .badge-trigger { background: rgba(234,179,8,.12);  color: var(--yellow);}

    /* ── Pagination ──────────────────────────────────────── */
    .pagination {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .page-info { font-size: 0.82rem; color: var(--muted); margin: 0 0.5rem; }

    /* ── Loading / error ─────────────────────────────────── */
    .state-row td {
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .error-bar {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--red);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    /* ── Sortable column headers ─────────────────────────── */
    th.sortable {
      cursor: pointer;
      user-select: none;
    }
    th.sortable:hover { color: var(--text); }
    th.sortable::after { content: ' ↕'; opacity: 0.3; font-size: 0.7em; }
    th.sort-asc::after  { content: ' ↑'; color: var(--accent); opacity: 1; }
    th.sort-desc::after { content: ' ↓'; color: var(--accent); opacity: 1; }

    @media (max-width: 768px) {
      .col-error, th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    🔄 Sync <span>Log</span>
    <small>Data API Builder — filter · $select · pagination demo</small>
  </div>
  <div class="header-actions">
    <a href="index.html" class="btn">← Dashboard</a>
    <button class="btn" id="theme-btn" title="Toggle light/dark">☀️</button>
  </div>
</header>

<main>
  <div id="error-box" class="error-bar" style="display:none"></div>

  <!-- Live URL display -->
  <div class="url-card">
    <span class="url-label">GET</span>
    <span class="url-text" id="url-display">/api/SyncLog</span>
    <button class="url-copy" id="url-copy-btn" title="Copy URL">copy</button>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Status ($filter)</span>
      <div class="select-pill" id="status-pills">
        <button class="pill active" data-val="">All</button>
        <button class="pill" data-val="Success">Success</button>
        <button class="pill" data-val="Error">Error</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Source ($filter)</span>
      <div class="select-pill" id="source-pills">
        <button class="pill active" data-val="">All</button>
        <button class="pill" data-val="IntervalsSync">IntervalsSync</button>
        <button class="pill" data-val="CalorieSync">CalorieSync</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">From (RunAt ≥)</span>
      <input type="date" id="date-from">
    </div>

    <div class="filter-group">
      <span class="filter-label">To (RunAt ≤)</span>
      <input type="date" id="date-to">
    </div>

    <div class="filter-group">
      <span class="filter-label">Page size ($top)</span>
      <select id="page-size">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </div>

    <div class="filter-group">
      <span class="filter-label">$select (slim payload)</span>
      <label class="select-toggle" id="select-toggle">
        <div class="toggle-track" id="select-track">
          <div class="toggle-knob"></div>
        </div>
        <span id="select-label">off — all columns</span>
      </label>
    </div>

    <div class="filter-group" style="margin-left:auto">
      <span class="filter-label">&nbsp;</span>
      <button class="btn" id="reset-btn">Reset filters</button>
    </div>
  </div>

  <!-- Stats + pagination -->
  <div class="stats-bar">
    <span class="stats-text" id="stats-text">Loading…</span>
    <div class="pagination">
      <button class="btn" id="btn-prev" disabled>← Prev</button>
      <span class="page-info" id="page-info">—</span>
      <button class="btn" id="btn-next" disabled>Next →</button>
    </div>
  </div>

  <!-- Results table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-col="LogId">ID</th>
          <th class="sortable sort-desc" data-col="RunAt">Run At</th>
          <th>Source</th>
          <th>Trigger</th>
          <th>Records</th>
          <th class="sortable" data-col="DurationMs">Duration</th>
          <th class="sortable" data-col="Status">Status</th>
          <th id="error-header">Error</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="state-row"><td colspan="8">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
// ── Config ─────────────────────────────────────────────────────────────────────
// __DAB_ENDPOINT__ is substituted by Terraform at deploy time.
// DAB is now served over HTTPS via Container Apps, so the browser can call it
// directly — no function proxy needed.
const DAB_BASE = '__DAB_ENDPOINT__'.startsWith('__') ? '' : '__DAB_ENDPOINT__';

// ── State ──────────────────────────────────────────────────────────────────────
const state = {
  status:    '',
  source:    '',
  dateFrom:  '',
  dateTo:    '',
  pageSize:  10,
  useSelect: false,
  sortCol:   'RunAt',
  sortDir:   'desc',
  // Cursor-based pagination ($after / nextLink)
  cursor:       null,   // $after token for the current page (null = first page)
  cursorStack:  [],     // stack of cursors for Prev navigation
  nextCursor:   null,   // $after token extracted from the last response's nextLink
  page:         1,
};

const SELECT_COLS = 'LogId,RunAt,Source,TriggerType,Status,DurationMs,ErrorMessage';

// ── URL builder ────────────────────────────────────────────────────────────────
// Build the OData query string manually — URLSearchParams encodes '$' as '%24'
// which DAB rejects. Keeping literal '$' signs is required for OData params.
function buildQueryString() {
  const parts = [];

  // $filter
  const filters = [];
  if (state.status)   filters.push(`Status eq '${state.status}'`);
  if (state.source)   filters.push(`Source eq '${state.source}'`);
  if (state.dateFrom) filters.push(`RunAt ge ${state.dateFrom}T00:00:00Z`);
  if (state.dateTo)   filters.push(`RunAt le ${state.dateTo}T23:59:59Z`);
  // Encode only spaces — DAB's datetime parser chokes on %3A-encoded colons,
  // treating the value as Edm.String instead of Edm.DateTimeOffset.
  if (filters.length) parts.push(`$filter=${filters.join(' and ').replace(/ /g, '%20')}`);

  parts.push(`$orderby=${state.sortCol} ${state.sortDir}`);
  parts.push(`$first=${state.pageSize}`);
  if (state.cursor) parts.push(`$after=${state.cursor}`);
  if (state.useSelect) parts.push(`$select=${SELECT_COLS}`);

  return parts.join('&');
}

// Display and fetch are the same URL — browser calls DAB directly over HTTPS.
function buildDisplayUrl() {
  return `${DAB_BASE}/api/SyncLog?${buildQueryString()}`;
}

const buildFetchUrl = buildDisplayUrl;

// ── Render the live URL with syntax highlighting ───────────────────────────────
function renderUrl(url) {
  const [base, qs] = url.split('?');
  if (!qs) { document.getElementById('url-display').textContent = base; return; }

  const parts = qs.split('&').map(part => {
    const eq = part.indexOf('=');
    const k  = part.slice(0, eq);
    const v  = decodeURIComponent(part.slice(eq + 1));
    return `<span class="qs-key">${k}</span><span class="qs-sep">=</span><span class="qs-val">${v}</span>`;
  });

  document.getElementById('url-display').innerHTML =
    `${base}<span class="qs-sep">?</span>` + parts.join('<span class="qs-sep">&amp;</span>');
}

// ── Fetch ──────────────────────────────────────────────────────────────────────
async function fetchLogs() {
  renderUrl(buildDisplayUrl());
  const url = buildFetchUrl();

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '<tr class="state-row"><td colspan="8">Loading…</td></tr>';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();

    const rows = data.value ?? [];

    // Extract $after token from nextLink for forward pagination.
    // nextLink is an absolute or relative URL — parse out the $after param.
    if (data.nextLink) {
      const nl = new URL(data.nextLink, window.location.href);
      state.nextCursor = nl.searchParams.get('$after');
    } else {
      state.nextCursor = null;
    }

    renderTable(rows);
    renderPagination();
    renderStats(rows.length);
    hideError();
  } catch (e) {
    showError(e.message);
    tbody.innerHTML = `<tr class="state-row"><td colspan="8">Failed to load — see error above.</td></tr>`;
  }
}

// ── Render table rows ──────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
       + ' '
       + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function fmtDur(ms) {
  if (ms == null) return '—';
  if (ms < 1000)  return `${ms} ms`;
  return `${(ms/1000).toFixed(2)} s`;
}

function fmtRecords(row) {
  // Only shown when $select is off (otherwise these columns aren't fetched)
  if (state.useSelect) return '<span class="col-hidden">not selected</span>';
  if (row.Source === 'CalorieSync') return '<span class="col-hidden">n/a</span>';
  const w = row.WellnessUpserted ?? 0;
  const a = row.ActivitiesUpserted ?? 0;
  return `<span style="color:var(--muted);font-size:0.78rem">${w}W · ${a}A</span>`;
}

function renderTable(rows) {
  const tbody = document.getElementById('table-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="state-row"><td colspan="8">No rows match the current filters.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="col-id">#${r.LogId}</td>
      <td class="col-time">${fmtDate(r.RunAt)}</td>
      <td><span class="badge badge-source">${r.Source ?? '—'}</span></td>
      <td><span class="badge badge-trigger">${r.TriggerType ?? '—'}</span></td>
      <td>${fmtRecords(r)}</td>
      <td class="col-dur">${fmtDur(r.DurationMs)}</td>
      <td><span class="badge badge-${(r.Status ?? '').toLowerCase()}">${r.Status ?? '—'}</span></td>
      <td class="col-error">${r.ErrorMessage ?? ''}</td>
    </tr>
  `).join('');
}

// ── Stats ──────────────────────────────────────────────────────────────────────
function renderStats(rowCount) {
  const suffix = state.nextCursor ? '+' : '';
  document.getElementById('stats-text').innerHTML =
    `Page <strong>${state.page}</strong> &mdash; <strong>${rowCount}</strong>${suffix} rows`;
}

// ── Pagination ─────────────────────────────────────────────────────────────────
function renderPagination() {
  document.getElementById('page-info').textContent = `Page ${state.page}`;
  document.getElementById('btn-prev').disabled = state.cursorStack.length === 0;
  document.getElementById('btn-next').disabled = state.nextCursor === null;
}

document.getElementById('btn-prev').addEventListener('click', () => {
  state.cursor = state.cursorStack.pop() ?? null;
  state.page--;
  fetchLogs();
});
document.getElementById('btn-next').addEventListener('click', () => {
  state.cursorStack.push(state.cursor);
  state.cursor = state.nextCursor;
  state.page++;
  fetchLogs();
});

// ── Filter controls ────────────────────────────────────────────────────────────
function resetCursor() {
  state.cursor = null;
  state.cursorStack = [];
  state.nextCursor = null;
  state.page = 1;
}

// Status pills
document.getElementById('status-pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('#status-pills .pill').forEach(p => {
    p.className = 'pill' + (p === pill ? (pill.dataset.val === 'Error' ? ' active-red' : pill.dataset.val === 'Success' ? ' active-green' : ' active') : '');
  });
  state.status = pill.dataset.val;
  resetCursor(); fetchLogs();
});

// Source pills
document.getElementById('source-pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('#source-pills .pill').forEach(p => {
    p.className = 'pill' + (p === pill ? ' active' : '');
  });
  state.source = pill.dataset.val;
  resetCursor(); fetchLogs();
});

// Date range
document.getElementById('date-from').addEventListener('change', e => {
  state.dateFrom = e.target.value; resetCursor(); fetchLogs();
});
document.getElementById('date-to').addEventListener('change', e => {
  state.dateTo = e.target.value; resetCursor(); fetchLogs();
});

// Page size
document.getElementById('page-size').addEventListener('change', e => {
  state.pageSize = parseInt(e.target.value, 10); resetCursor(); fetchLogs();
});

// $select toggle
document.getElementById('select-toggle').addEventListener('click', () => {
  state.useSelect = !state.useSelect;
  const track = document.getElementById('select-track');
  track.classList.toggle('on', state.useSelect);
  document.getElementById('select-label').textContent = state.useSelect
    ? `on — ${SELECT_COLS.split(',').length} columns`
    : 'off — all columns';
  fetchLogs();
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  state.status = ''; state.source = ''; state.dateFrom = ''; state.dateTo = '';
  state.pageSize = 10; state.useSelect = false;
  resetCursor();

  document.querySelectorAll('#status-pills .pill, #source-pills .pill').forEach(p => {
    p.className = 'pill' + (p.dataset.val === '' ? ' active' : '');
  });
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value   = '';
  document.getElementById('page-size').value = '10';
  document.getElementById('select-track').classList.remove('on');
  document.getElementById('select-label').textContent = 'off — all columns';
  fetchLogs();
});

// ── Column sort ────────────────────────────────────────────────────────────────
function renderSortHeaders() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.className = 'sortable';
    if (th.dataset.col === state.sortCol) th.classList.add(`sort-${state.sortDir}`);
  });
}

document.querySelector('thead').addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  const col = th.dataset.col;
  if (col === state.sortCol) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortCol = col;
    state.sortDir = 'asc';
  }
  renderSortHeaders();
  resetCursor();
  fetchLogs();
});

// ── URL copy ───────────────────────────────────────────────────────────────────
document.getElementById('url-copy-btn').addEventListener('click', () => {
  const displayUrl = buildDisplayUrl();
  const url = displayUrl.startsWith('http') ? displayUrl : window.location.origin + displayUrl;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('url-copy-btn');
    btn.textContent = '✓ copied';
    setTimeout(() => { btn.textContent = 'copy'; }, 1500);
  });
});

// ── Theme toggle ───────────────────────────────────────────────────────────────
(function () {
  const saved = localStorage.getItem('theme') || 'dark';
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  document.getElementById('theme-btn').textContent = saved === 'light' ? '🌙' : '☀️';
})();
document.getElementById('theme-btn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  document.getElementById('theme-btn').textContent = next === 'light' ? '🌙' : '☀️';
  localStorage.setItem('theme', next);
});

// ── Error helpers ──────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = `Error: ${msg}`; el.style.display = 'block';
}
function hideError() { document.getElementById('error-box').style.display = 'none'; }

// ── Boot ───────────────────────────────────────────────────────────────────────
renderSortHeaders();
fetchLogs();
</script>
</body>
</html>
