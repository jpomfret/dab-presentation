<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#0f1117"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Chase the Sun — Architecture</text>
  <text x="500" y="52" text-anchor="middle" fill="#64748b" font-size="11">Data API Builder as the central data access layer</text>

  <!-- ═══════════════ LEFT: intervals.icu ═══════════════ -->
  <rect x="35" y="72" width="175" height="78" rx="10" fill="#1a1d27" stroke="#f97316" stroke-width="1.5"/>
  <text x="122" y="101" text-anchor="middle" font-size="22">⏱️</text>
  <text x="122" y="122" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">intervals.icu</text>
  <text x="122" y="139" text-anchor="middle" fill="#64748b" font-size="10">Training Data API</text>

  <!-- Arrow down: intervals.icu → Function -->
  <line x1="122" y1="150" x2="122" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- ═══════════════ LEFT: Azure Function ═══════════════ -->
  <rect x="35" y="192" width="175" height="88" rx="10" fill="#1a1d27" stroke="#0078d4" stroke-width="1.5"/>
  <text x="122" y="222" text-anchor="middle" font-size="22">⚡</text>
  <text x="122" y="244" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Azure Function</text>
  <text x="122" y="261" text-anchor="middle" fill="#64748b" font-size="10">IntervalsSync · Timer Trigger</text>
  <text x="122" y="274" text-anchor="middle" fill="#64748b" font-size="10">PowerShell · Managed Identity</text>

  <!-- Arrow right: Function → DAB (write) -->
  <line x1="210" y1="236" x2="382" y2="236" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>
  <text x="296" y="226" text-anchor="middle" fill="#f97316" font-size="10" font-weight="600">POST /api/Upsert*</text>
  <text x="296" y="254" text-anchor="middle" fill="#64748b" font-size="9">Authenticated (Entra JWT)</text>

  <!-- ═══════════════ CENTER: DAB Container ═══════════════ -->
  <rect x="382" y="178" width="212" height="102" rx="12" fill="#1a1d27" stroke="#8b5cf6" stroke-width="2"/>
  <text x="488" y="212" text-anchor="middle" font-size="24">🔌</text>
  <text x="488" y="236" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Data API Builder</text>
  <text x="488" y="254" text-anchor="middle" fill="#64748b" font-size="10">REST · GraphQL · ACI Container</text>
  <text x="488" y="268" text-anchor="middle" fill="#64748b" font-size="10">Entra JWT Auth · Anonymous Read</text>

  <!-- Arrows: DAB ↔ SQL (bidirectional) -->
  <line x1="478" y1="280" x2="478" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  <line x1="498" y1="342" x2="498" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- ═══════════════ CENTER: Azure SQL ═══════════════ -->
  <rect x="385" y="342" width="206" height="95" rx="10" fill="#1a1d27" stroke="#0078d4" stroke-width="1.5"/>
  <text x="488" y="372" text-anchor="middle" font-size="22">🗄️</text>
  <text x="488" y="395" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Azure SQL Database</text>
  <text x="488" y="412" text-anchor="middle" fill="#64748b" font-size="10">IntervalsWellness · IntervalsActivity</text>
  <text x="488" y="426" text-anchor="middle" fill="#64748b" font-size="10">SyncLog · AdventureWorksLT</text>

  <!-- Arrow right: DAB → SWA (read) -->
  <line x1="594" y1="236" x2="762" y2="236" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="678" y="226" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">GET /api/Intervals*</text>
  <text x="678" y="254" text-anchor="middle" fill="#64748b" font-size="9">Anonymous · SWA Proxy</text>

  <!-- ═══════════════ RIGHT: Static Web App ═══════════════ -->
  <rect x="762" y="178" width="205" height="102" rx="10" fill="#1a1d27" stroke="#22c55e" stroke-width="1.5"/>
  <text x="864" y="212" text-anchor="middle" font-size="22">🌐</text>
  <text x="864" y="236" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Static Web App</text>
  <text x="864" y="254" text-anchor="middle" fill="#64748b" font-size="10">Chase the Sun Dashboard</text>
  <text x="864" y="268" text-anchor="middle" fill="#64748b" font-size="10">Node.js API Proxy Functions</text>

  <!-- Arrow up: SWA → Browser -->
  <line x1="864" y1="178" x2="864" y2="153" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- ═══════════════ RIGHT: Browser ═══════════════ -->
  <rect x="762" y="74" width="205" height="78" rx="10" fill="#1a1d27" stroke="#2a2d3e" stroke-width="1.5"/>
  <text x="864" y="103" text-anchor="middle" font-size="22">💻</text>
  <text x="864" y="124" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Browser</text>
  <text x="864" y="141" text-anchor="middle" fill="#64748b" font-size="9">blue-mud-0e8339c03.7.azurestaticapps.net</text>

  <!-- ═══════════════ Storage (below, small) ═══════════════ -->
  <rect x="210" y="360" width="148" height="60" rx="8" fill="#1a1d27" stroke="#2a2d3e" stroke-width="1"/>
  <text x="284" y="385" text-anchor="middle" font-size="16">📦</text>
  <text x="284" y="403" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Azure Storage</text>
  <text x="284" y="416" text-anchor="middle" fill="#64748b" font-size="9">dab-config.json file share</text>

  <!-- Arrow: Storage → DAB (config mount) -->
  <line x1="358" y1="385" x2="383" y2="300" stroke="#2a2d3e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="388" y="348" fill="#475569" font-size="9">config mount</text>

  <!-- ═══════════════ Legend ═══════════════ -->
  <rect x="315" y="455" width="370" height="34" rx="6" fill="#1a1d27" stroke="#2a2d3e" stroke-width="1"/>
  <line x1="335" y1="472" x2="365" y2="472" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="372" y="476" fill="#64748b" font-size="10">write path</text>
  <line x1="450" y1="472" x2="480" y2="472" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="487" y="476" fill="#64748b" font-size="10">read path</text>
  <line x1="558" y1="472" x2="588" y2="472" stroke="#475569" stroke-width="1.5"/>
  <text x="595" y="476" fill="#64748b" font-size="10">infrastructure</text>
</svg>
