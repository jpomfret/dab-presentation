<svg width="1000" height="510" viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img">
  <title>Chase the Sun — Architecture</title>
  <desc>Architecture diagram with Kubernetes cluster at top-centre, intervals.icu top-left, browser top-right. Azure Function and DAB in the middle row. Azure SQL below DAB. Both write sources feed DAB downward.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea6d07"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="510" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="700">Chase the Sun — Architecture</text>
  <text x="500" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Data API Builder as the central data access layer</text>

  <!-- intervals.icu -->
  <rect x="22" y="62" width="158" height="82" rx="10" fill="#fff" stroke="#f97316" stroke-width="1.5"/>
  <text x="101" y="90"  text-anchor="middle" font-size="22">⏱️</text>
  <text x="101" y="113" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">intervals.icu</text>
  <text x="101" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">Training Data API</text>

  <!-- Kubernetes cluster (faded) -->
  <g opacity="0.12">
  <!-- Kubernetes cluster background -->
  <rect x="202" y="55" width="426" height="114" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="415" y="73" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">KUBERNETES  ·  AKS / FuelGauge</text>

  <!-- InfluxDB -->
  <rect x="215" y="78" width="122" height="82" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="276" y="104" text-anchor="middle" font-size="20">📊</text>
  <text x="276" y="126" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">InfluxDB</text>
  <text x="276" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">BMR · Active Calories</text>

  <!-- Postgres -->
  <rect x="351" y="78" width="122" height="82" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="412" y="104" text-anchor="middle" font-size="20">🐘</text>
  <text x="412" y="126" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">PostgreSQL</text>
  <text x="412" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">calorie_entries</text>

  <!-- CronJob -->
  <rect x="487" y="78" width="122" height="82" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="548" y="104" text-anchor="middle" font-size="20">⏲️</text>
  <text x="548" y="126" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">CronJob</text>
  <text x="548" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">CalorieSync</text>
  <text x="548" y="154" text-anchor="middle" fill="#94a3b8" font-size="9">Workload Identity</text>

  <!-- Internal arrows -->
  <line x1="337" y1="119" x2="351" y2="119" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  <line x1="473" y1="119" x2="487" y2="119" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  </g>

  <!-- Browser -->
  <rect x="800" y="62" width="178" height="82" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="889" y="90"  text-anchor="middle" font-size="22">💻</text>
  <text x="889" y="113" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Browser</text>
  <text x="889" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">blue-mud-0e8339c03.7.azurestaticapps.net</text>

  <!-- Arrow: intervals.icu → Azure Function (down) -->
  <line x1="101" y1="144" x2="101" y2="186" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- Azure Function -->
  <rect x="22" y="186" width="158" height="92" rx="10" fill="#fff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="101" y="216" text-anchor="middle" font-size="22">⚡</text>
  <text x="101" y="238" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Azure Function</text>
  <text x="101" y="255" text-anchor="middle" fill="#94a3b8" font-size="10">IntervalsSync · Timer Trigger</text>
  <text x="101" y="268" text-anchor="middle" fill="#94a3b8" font-size="10">PowerShell · Managed Identity</text>

  <!-- Arrow: Azure Function → DAB (right, write) -->
  <line x1="180" y1="232" x2="355" y2="232" stroke="#ea6d07" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>
  <text x="267" y="222" text-anchor="middle" fill="#ea6d07" font-size="10" font-weight="600">POST /api/Upsert*</text>
  <text x="267" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">Authenticated (Entra JWT)</text>

  <!-- Arrow: CronJob → DAB (down write, L-shape, faded) -->
  <g opacity="0.12">
  <path d="M548,160 L548,172 L464,172 L464,181" fill="none" stroke="#ea6d07" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>
  <text x="560" y="172" text-anchor="start" fill="#ea6d07" font-size="9" font-weight="600">POST /api/UpsertCalories*</text>
  </g>

  <!-- DAB -->
  <rect x="355" y="181" width="218" height="104" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="464" y="214" text-anchor="middle" font-size="24">🔌</text>
  <text x="464" y="238" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="700">Data API Builder</text>
  <text x="464" y="256" text-anchor="middle" fill="#94a3b8" font-size="10">REST · GraphQL · ACI Container</text>
  <text x="464" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Entra JWT Auth · Anonymous Read</text>

  <!-- Arrow: DAB → SWA (right, read) -->
  <line x1="573" y1="233" x2="800" y2="233" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="686" y="223" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="600">GET /api/Intervals*</text>
  <text x="686" y="249" text-anchor="middle" fill="#94a3b8" font-size="9">Anonymous · SWA Proxy</text>

  <!-- SWA -->
  <rect x="800" y="181" width="178" height="104" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="889" y="214" text-anchor="middle" font-size="22">🌐</text>
  <text x="889" y="238" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Static Web App</text>
  <text x="889" y="256" text-anchor="middle" fill="#94a3b8" font-size="10">Chase the Sun Dashboard</text>
  <text x="889" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Node.js API Proxy Functions</text>

  <!-- Arrow: SWA → Browser (up) -->
  <line x1="889" y1="181" x2="889" y2="144" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- DAB ↔ SQL bidirectional -->
  <line x1="454" y1="285" x2="454" y2="323" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  <line x1="474" y1="323" x2="474" y2="287" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- Azure SQL -->
  <rect x="355" y="323" width="218" height="112" rx="10" fill="#fff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="464" y="352" text-anchor="middle" font-size="22">🗄️</text>
  <text x="464" y="374" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Azure SQL Database</text>
  <text x="464" y="391" text-anchor="middle" fill="#94a3b8" font-size="10">IntervalsWellness · IntervalsActivity</text>
  <text x="464" y="406" text-anchor="middle" fill="#94a3b8" font-size="10">FuelGaugeCalories · FuelGaugeCalorieBurn</text>
  <text x="464" y="421" text-anchor="middle" fill="#94a3b8" font-size="10">SyncLog · AdventureWorksLT</text>

  <!-- Azure Storage -->
  <rect x="162" y="335" width="155" height="62" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="239" y="360" text-anchor="middle" font-size="16">📦</text>
  <text x="239" y="378" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Azure Storage</text>
  <text x="239" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">dab-config.json file share</text>

  <!-- Arrow: Storage → DAB (config mount) -->
  <line x1="317" y1="358" x2="354" y2="310" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="358" y="320" fill="#cbd5e1" font-size="9">config mount</text>

  <!-- Legend -->
  <rect x="265" y="458" width="470" height="34" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="285" y1="475" x2="315" y2="475" stroke="#ea6d07" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="322" y="479" fill="#94a3b8" font-size="10">write path</text>
  <line x1="405" y1="475" x2="435" y2="475" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="442" y="479" fill="#94a3b8" font-size="10">read path</text>
  <line x1="520" y1="475" x2="550" y2="475" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="557" y="479" fill="#94a3b8" font-size="10">infrastructure</text>
  <line x1="648" y1="475" x2="678" y2="475" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="685" y="479" fill="#94a3b8" font-size="10">k8s cluster</text>
</svg>
